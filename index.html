<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div class="task-box">

            <h1>📝 Task Manager</h1>
            <p class="subtitle">Manage your daily tasks easily</p>

            <div class="input-section">
                <input 
                    type="text" 
                    id="taskInput" 
                    placeholder="Enter a new task..."
                >
                <button onclick="addTask()">Add Task</button>
            </div>

            <div class="task-info">
                <span>Total Tasks: <b id="totalTasks">0</b></span>
                <span>Completed: <b id="completedTasks">0</b></span>
            </div>

            <ul id="taskList"></ul>

            <button class="clear-btn" onclick="clearCompleted()">
                Clear Completed
            </button>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
